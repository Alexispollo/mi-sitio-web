<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de Derecho Laboral - LFT</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#677084; --accent:#2f5bea; --ok:#1f8a4c; --okbg:#e6f6ec; --bad:#c23b3b; --badbg:#fbeaea; --line:#dfe3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1e232c; --text:#e8ebf1; --muted:#9aa3b5; --accent:#6f8dff; --ok:#4cc582; --okbg:#173326; --bad:#ef7a7a; --badbg:#3a1f1f; --line:#323946; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:8px; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .meta { display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .q { font-size:1.1rem; font-weight:600; margin:0 0 16px; }
  .opt { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; font:inherit; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--accent); }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--ok); background:var(--okbg); }
  .opt.bad { border-color:var(--bad); background:var(--badbg); }
  .exp { margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--bg); border:1px solid var(--line); font-size:.95rem; }
  .exp b.ok { color:var(--ok); } .exp b.bad { color:var(--bad); }
  button.main { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; }
  .score { font-size:2.4rem; font-weight:700; margin:8px 0; }
  .note { color:var(--muted); font-size:.8rem; margin-top:20px; }
  ul.rev { padding-left:18px; } ul.rev li { margin-bottom:8px; font-size:.92rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quiz de Derecho Laboral</h1>
  <p class="sub">Ley Federal del Trabajo (aplicable en Baja California / Ensenada)</p>
  <div class="card" id="app"></div>
  <p class="note">Verifica artículos y cifras contra tu texto de la ley o el de tu curso.</p>
</div>

<script>
// Formato: [pregunta, [opciones], índice de la correcta (0-3), explicación]
const DATA = [
["Según la LFT (art. 58), la jornada de trabajo es:",
 ["El tiempo en que el trabajador ejecuta materialmente las labores pactadas en su contrato","El periodo entre la entrada y la salida del centro de trabajo, sin contar los descansos","El tiempo durante el cual el trabajador está a disposición del patrón para prestar su trabajo","El horario fijado por el patrón en el reglamento interior para cada departamento"],2,
 "El art. 58 la define como el tiempo en que el trabajador está a disposición del patrón, no solo el tiempo de trabajo efectivo."],
["¿Cuál es la duración máxima de la jornada nocturna (8 pm a 6 am)?",
 ["Seis horas","Siete horas","Siete horas y media","Ocho horas"],1,
 "Art. 61: diurna 8 horas, nocturna 7 y mixta 7 horas y media."],
["El tiempo extraordinario no puede exceder de:",
 ["Tres horas diarias ni tres veces en una semana","Cuatro horas diarias ni tres veces en una semana","Tres horas diarias ni cuatro veces en una semana","Dos horas diarias ni cinco veces en una semana"],0,
 "Art. 66: máximo 3 horas diarias y 3 veces por semana."],
["¿Cómo se pagan las horas extra (arts. 67 y 68)?",
 ["Con un 50% adicional sobre el salario de la hora ordinaria","Triple las primeras nueve horas semanales y doble las excedentes","Doble siempre, sin importar cuántas horas se trabajen en la semana","Doble las primeras nueve horas semanales y triple las que excedan"],3,
 "Las primeras 9 horas extra a la semana se pagan al doble; las que excedan, al triple."],
["La prima dominical mínima que debe pagarse al trabajador que labora en domingo es de:",
 ["15% sobre el salario de un día ordinario","50% sobre el salario de un día ordinario","25% sobre el salario de un día ordinario","100% sobre el salario de un día ordinario"],2,
 "Art. 71: prima no menor al 25% sobre el salario de un día ordinario."],
["Si el trabajador labora en su día de descanso semanal, el patrón debe pagarle:",
 ["Un salario doble por el servicio, además del salario que le corresponde por el descanso","Solamente un 50% adicional al salario ordinario de ese día","El salario de un día ordinario más la prima dominical del 25%","Un salario triple por el servicio, sin considerar el salario del descanso"],0,
 "Art. 73: salario doble por el servicio, independientemente del salario del descanso (en la práctica, el equivalente a tres días)."],
["¿Cuál de las siguientes fechas NO es día de descanso obligatorio según el art. 74?",
 ["1 de enero","16 de septiembre","25 de diciembre","12 de diciembre"],3,
 "El 12 de diciembre no está en el art. 74. Sí lo están: 1 de enero, primer lunes de febrero, tercer lunes de marzo, 1 de mayo, 16 de septiembre, tercer lunes de noviembre, 25 de diciembre y 1 de octubre cada seis años."],
["Tras la reforma de 2023 (vacaciones dignas), ¿cuántos días laborables de vacaciones corresponden al cumplir el primer año de servicios?",
 ["Seis días","Doce días","Diez días","Catorce días"],1,
 "Art. 76: 12 días laborables al primer año, con aumento de 2 días por año hasta llegar a 20 al quinto año."],
["¿Cuántos días de vacaciones corresponden a un trabajador que cumple seis años de servicios?",
 ["Veinte días","Dieciocho días","Veintidós días","Veinticuatro días"],2,
 "Del año 1 al 5 se pasa de 12 a 20 días; a partir del sexto año se suman 2 días por cada cinco años, así que del 6.º al 10.º año son 22."],
["La prima vacacional no puede ser menor a:",
 ["25% sobre los salarios correspondientes al periodo vacacional","15% sobre los salarios correspondientes al periodo vacacional","30% sobre el salario mensual del trabajador","50% sobre los salarios correspondientes al periodo vacacional"],0,
 "Art. 80: prima vacacional mínima del 25%."],
["¿En qué plazo deben concederse las vacaciones, contado desde que se cumple el año de servicios?",
 ["Dentro de los tres meses siguientes","Dentro de los doce meses siguientes","Dentro de los treinta días siguientes","Dentro de los seis meses siguientes"],3,
 "Art. 81: dentro de los seis meses siguientes al cumplimiento del año de servicios. Además, el art. 78 exige que al menos seis días sean continuos."],
["Según el art. 90, el salario mínimo es:",
 ["La cantidad mayor que puede pagarse por jornada, fijada cada año por el Ejecutivo estatal","La cantidad menor que debe recibir en efectivo el trabajador por los servicios de una jornada","El promedio de ingresos diarios del trabajador durante los últimos treinta días laborados","La cuota diaria pactada en el contrato más las prestaciones en especie recibidas"],1,
 "Art. 90: la cantidad menor que debe recibir en efectivo por una jornada. Debe bastar para las necesidades de un jefe de familia y la educación obligatoria de los hijos."],
["¿Cada cuánto debe pagarse el salario (art. 88)?",
 ["Plazos no mayores de una semana (trabajo material) o quince días (los demás)","Plazos no mayores de quince días (trabajo material) o un mes (los demás)","Plazos no mayores de una semana para todos los trabajadores sin distinción","Plazos no mayores de un mes para todos los trabajadores sin distinción"],0,
 "Art. 88: semanal para quienes realizan trabajo material y quincenal para los demás."],
["Para descontar deudas contraídas con el patrón (anticipos, pagos en exceso, errores), el descuento no puede ser mayor al:",
 ["50% del salario total de cada pago","20% del salario total de cada pago","30% del excedente del salario mínimo","10% del salario mínimo vigente"],2,
 "Art. 110, fr. I: la deuda no puede exceder de un mes de salario y el descuento no puede ser mayor al 30% del excedente del salario mínimo."],
["El aguinaldo mínimo legal y su fecha límite de pago son:",
 ["15 días de salario, antes del 31 de diciembre","15 días de salario, antes del 20 de diciembre","30 días de salario, antes del 20 de diciembre","10 días de salario, antes del 15 de diciembre"],1,
 "Art. 87: no menor de 15 días de salario, pagadero antes del 20 de diciembre. Quienes no cumplieron el año reciben la parte proporcional."],
["La PTU debe pagarse dentro de:",
 ["Los treinta días siguientes al cierre del ejercicio fiscal","Los noventa días siguientes al cierre del ejercicio fiscal","Los quince días siguientes a la presentación de la declaración mensual","Los sesenta días siguientes a la fecha en que deba pagarse el impuesto anual"],3,
 "Art. 122: 60 días después de la fecha límite de la declaración anual (en la práctica, hasta el 30 de mayo para personas morales y el 29 de junio para personas físicas)."],
["Desde la reforma de 2021, el tope individual de la PTU es de:",
 ["Tres meses de salario o el promedio de la PTU de los últimos tres años, lo que sea más favorable","Un mes de salario o el promedio de la PTU de los últimos tres años, lo que sea menor","Seis meses de salario, sin considerar el promedio de años anteriores","Quince días de salario más el promedio de la PTU del año anterior"],0,
 "Art. 127, fr. VIII: tope de tres meses de salario o el promedio recibido en los últimos tres años, aplicando el monto más favorable al trabajador."],
["¿Desde qué edad está permitido el trabajo de menores en México?",
 ["Catorce años, con permiso de los padres","Dieciséis años, con certificado médico únicamente","Quince años, con autorización y requisitos adicionales","Dieciocho años, sin ninguna excepción"],2,
 "Art. 22: está prohibido el trabajo de menores de 15 años. De 15 a 17 se requiere certificado médico, autorización de padres o tutores y cumplir con la educación obligatoria, o contar con aprobación de la Inspección del Trabajo."],
["La jornada máxima de los menores de 16 años es de:",
 ["Seis horas continuas, sin periodos de reposo","Seis horas diarias, en periodos máximos de tres con reposo de una hora","Siete horas diarias, en periodos máximos de cuatro con reposo de media hora","Ocho horas diarias, con reposo de una hora a mitad de la jornada"],1,
 "Art. 177: seis horas diarias en periodos de máximo tres horas, con reposo de al menos una hora entre ellos. No pueden laborar horas extra ni domingos ni días de descanso (art. 178)."],
["Los menores de 18 años tienen derecho a vacaciones anuales pagadas de, por lo menos:",
 ["Doce días laborables","Quince días laborables","Veinte días laborables","Dieciocho días laborables"],3,
 "Art. 179: vacaciones de 18 días laborables como mínimo."],
["El descanso por maternidad comprende:",
 ["Seis semanas antes y seis semanas después del parto","Cuatro semanas antes y ocho semanas después del parto","Seis semanas únicamente después del parto","Ocho semanas antes y cuatro semanas después del parto"],0,
 "Art. 170, fr. II. Puede transferirse hasta cuatro semanas del descanso previo al posterior al parto, con autorización médica y acuerdo con el patrón."],
["Durante el periodo de lactancia, las madres tienen derecho a:",
 ["Un reposo de una hora diaria, durante nueve meses","Dos reposos de una hora cada uno, durante un año","Dos reposos extraordinarios de media hora al día, hasta por seis meses","Un reposo de media hora al día, durante tres meses"],2,
 "Art. 170, fr. IV: dos reposos extraordinarios de media hora por día, por un periodo no mayor de seis meses."],
["Según el art. 279, los trabajadores del campo son:",
 ["Quienes laboran únicamente en temporadas de cosecha y son contratados por intermediarios","Quienes ejecutan los trabajos propios y habituales de agricultura, ganadería y forestales al servicio de un patrón","Quienes son propietarios de la tierra y la trabajan con ayuda de su familia","Quienes prestan servicios en empacadoras y bodegas agrícolas, aunque no trabajen la tierra"],1,
 "Art. 279. Los eventuales del campo están regulados aparte (art. 279 Bis) y tienen derecho a prestaciones proporcionales y al IMSS."],
["Según el art. 9, la categoría de trabajador de confianza depende de:",
 ["La designación o el nombre que se dé al puesto en el contrato","El nivel de salario que perciba en relación con los demás trabajadores","La antigüedad del trabajador y su cercanía con el patrón","La naturaleza de las funciones desempeñadas, no del nombre del puesto"],3,
 "Art. 9: son funciones de confianza las de dirección, inspección, vigilancia y fiscalización con carácter general, y las de trabajos personales del patrón dentro de la empresa."],
["Los agentes de comercio, vendedores, viajantes y propagandistas son trabajadores de la empresa cuando:",
 ["Su actividad sea de carácter permanente","Perciban un salario fijo mensual además de comisiones","Trabajen exclusivamente para un solo patrón","Sus ventas superen un monto mínimo mensual pactado"],0,
 "Art. 285: son trabajadores de la empresa cuando su actividad sea de carácter permanente; si es transitoria no se les aplica este capítulo."],
["En el trabajo de autotransportes (arts. 256 y ss.), el salario puede fijarse por unidad de tiempo, por viaje, por boletos vendidos, por circuito o kilómetros recorridos, y:",
 ["Puede ser inferior al mínimo si el trabajador recibe propinas","Solo puede pagarse en especie cuando el viaje es foráneo","No puede ser inferior al salario mínimo","Se fija libremente por el permisionario sin límite alguno"],2,
 "Art. 257: el salario puede ser cantidad fija, prima sobre ingresos o una combinación, pero nunca inferior al mínimo."],
["En Ensenada, B.C., ¿qué salario mínimo se aplica?",
 ["El salario mínimo general del resto del país","El de la Zona Libre de la Frontera Norte","El que fije el municipio cada año según su inflación local","El salario mínimo profesional, que sustituye al general"],1,
 "Los municipios de Baja California, incluido Ensenada, están en la Zona Libre de la Frontera Norte, con un salario mínimo mayor al general. Verifica la cifra vigente de la CONASAMI."],
["Antes de demandar ante el Tribunal Laboral en Baja California, ¿qué instancia es obligatoria en la mayoría de los conflictos individuales?",
 ["La Junta Local de Conciliación y Arbitraje del Estado","La Procuraduría Federal de la Defensa del Trabajo","La Inspección del Trabajo de la Secretaría del Trabajo estatal","El Centro de Conciliación Laboral del Estado de Baja California"],3,
 "Tras la reforma laboral de 2019, la conciliación prejudicial es obligatoria ante el Centro de Conciliación Laboral (con sede en Ensenada); las Juntas de Conciliación y Arbitraje desaparecieron. Hay excepciones, como discriminación, trabajo infantil y protección a la maternidad."]
];

const app = document.getElementById('app');
let qs, i, score, wrong;

function shuffle(a) {
  a = a.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function start() {
  // Mezcla el orden de las preguntas y de las opciones en cada intento
  qs = shuffle(DATA).map(([p, opts, c, e]) => {
    const correct = opts[c];
    return { p, opts: shuffle(opts), correct, e };
  });
  i = 0; score = 0; wrong = [];
  render();
}

function render() {
  if (i >= qs.length) return finish();
  const q = qs[i];
  app.innerHTML = `
    <div class="bar"><div style="width:${(i / qs.length) * 100}%"></div></div>
    <div class="meta"><span>Pregunta ${i + 1} de ${qs.length}</span><span>Aciertos: ${score}</span></div>
    <p class="q">${q.p}</p>
    <div id="opts"></div>
    <div id="fb"></div>`;
  const box = document.getElementById('opts');
  q.opts.forEach(text => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.onclick = () => answer(b, text);
    box.appendChild(b);
  });
}

function answer(btn, text) {
  const q = qs[i];
  const good = text === q.correct;
  if (good) score++; else wrong.push(q);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('ok');
  });
  if (!good) btn.classList.add('bad');
  document.getElementById('fb').innerHTML = `
    <div class="exp"><b class="${good ? 'ok' : 'bad'}">${good ? '¡Correcto!' : 'Incorrecto.'}</b> ${q.e}</div>
    <button class="main" id="next">${i + 1 < qs.length ? 'Siguiente' : 'Ver resultado'}</button>`;
  document.getElementById('next').onclick = () => { i++; render(); };
}

function finish() {
  const pct = Math.round((score / qs.length) * 100);
  app.innerHTML = `
    <div class="bar"><div style="width:100%"></div></div>
    <p class="q">Resultado final</p>
    <div class="score">${score} / ${qs.length} (${pct}%)</div>
    ${wrong.length ? `<p>Para repasar:</p><ul class="rev">${wrong.map(q => `<li><b>${q.p}</b><br>${q.correct}</li>`).join('')}</ul>` : '<p>¡Sin errores!</p>'}
    <button class="main" id="again">Intentar de nuevo</button>`;
  document.getElementById('again').onclick = start;
}

start();
</script>
</body>
</html>
