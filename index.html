<style>

.res header { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }

.user { white-space: pre-wrap; overflow-wrap: anywhere; }
.ansline { max-width: 65ch; }
.ansline.li { padding-left: 1.1rem; text-indent: -1.1rem; }
.note { font-size: .85rem; color: var(--muted); }

const toks = s => norm(s).split(/\s+/).filter(Boolean);

function prefLev(a, t) {
  const n = a.length, m = t.length;
  let prev = Array.from({ length: m + 1 }, (_, j) => j), best = Infinity;
  for (let i = 1; i <= n; i++) {
    const cur = [i];
    for (let j = 1; j <= m; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === t[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  for (let j = 0; j <= m; j++) best = Math.min(best, prev[j]);
  return best;
}
function wordMatch(t, a) {
  if (t === a) return true;
  if (a.length <= 3) return false;
  if (t.startsWith(a)) return true;
  if (t.length >= 5 && a.startsWith(t)) return true;
  const sa = a.slice(0, 6);
  if (sa.length <= 4) return false;
  return prefLev(sa, t) <= 1;
}
function altMatch(alt, tk) {
  return toks(alt).every(w => tk.some(t => wordMatch(t, w)));
}
function grade(q, text) {
  const tk = toks(text);
  if (tk.length < 2) return { status: "bad", credit: 0, cov: 0, empty: tk.length === 0 };
  const hits = q.k.map(alts => alts.some(a => altMatch(a, tk)));
  const cov = hits.filter(Boolean).length / q.k.length;
  const mustOk = (q.must || []).every(i => hits[i]);
  let lvl = cov >= 0.7 ? 2 : cov >= 0.4 ? 1 : 0;
  if (!mustOk) lvl = Math.max(0, lvl - 1);
  const status = ["bad", "partial", "ok"][lvl];
  return { status, credit: [0, 0.5, 1][lvl], cov, empty: false };
}

// ---UI---
const app = document.getElementById("app");
const KEY = "examen-bienes-derechos-reales-v1";
let S = { screen: "start", order: [], idx: 0, answers: {}, res: null, confirm: false, filter: "all" };

function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify({ order: S.order, idx: S.idx, answers: S.answers })); } catch (e) {} }
function clearProgress() { try { localStorage.removeItem(KEY); } catch (e) {} }
function loadProgress() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!o || !Array.isArray(o.order) || !o.order.length) return null;
    if (!o.order.every(i => Number.isInteger(i) && i >= 0 && i < Q.length)) return null;
    return { order: o.order, idx: Math.min(Math.max(+o.idx || 0, 0), o.order.length - 1), answers: o.answers && typeof o.answers === "object" ? o.answers : {} };
  } catch (e) { return null; }
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const answered = () => S.order.filter(i => (S.answers[i] || "").trim()).length;
const pad = n => String(n).padStart(2, "0");
const ansLines = q => q.ans.map(l => `<p class="ansline${/^(•|\d+\.)\s/.test(l) ? " li" : ""}">${esc(l)}</p>`).join("");

function renderStart() {
  const saved = loadProgress();
  const savedCount = saved ? saved.order.filter(i => (saved.answers[i] || "").trim()).length : 0;
  app.innerHTML = `
  <section class="card">
    <p class="eyebrow">Bienes, derechos reales y patrimonio</p>
    <h1>Examen de Bienes y Derechos Reales</h1>
    <p class="lead">${Q.length} preguntas abiertas basadas en tu guía de estudio.</p>
    <ul class="facts">
      <li>Escribe tus respuestas con tus propias palabras. Se califica el contenido, así que los acentos, las mayúsculas y los errores de ortografía pequeños no cuentan en tu contra.</li>
      <li>No verás si acertaste hasta el final. Ahí aparecen tu calificación y la respuesta correcta de cada pregunta.</li>
      <li>No hay límite de tiempo. Tu avance se guarda en este navegador.</li>
    </ul>
    <label class="check" for="shuffle"><input type="checkbox" id="shuffle"> Mezclar el orden de las preguntas</label>
    <div class="row">
      ${saved ? `<button class="btn primary" data-act="resume">Continuar (${savedCount} respondidas)</button><button class="btn" data-act="start">Empezar de nuevo</button>` : `<button class="btn primary" data-act="start">Comenzar examen</button>`}
    </div>
  </section>`;
}

function renderExam(focus) {
  const qi = S.order[S.idx], q = Q[qi], total = S.order.length, last = S.idx === total - 1;
  const done = answered();
  const chips = S.order.map((i, p) => `<button class="chip${p === S.idx ? " cur" : (S.answers[i] || "").trim() ? " done" : ""}" data-act="go" data-p="${p}" aria-label="Pregunta ${p + 1}${(S.answers[i] || "").trim() ? ", respondida" : ""}"${p === S.idx ? ' aria-current="step"' : ""}>${p + 1}</button>`).join("");
  const missing = total - done;
  app.innerHTML = `
  <div class="progress">
    <div class="meta"><span class="mono">Pregunta <b>${S.idx + 1}</b> de ${total}</span><span class="mono muted" id="cnt">${done} respondidas</span></div>
    <div class="bar"><i id="barfill" style="width:${(done / total) * 100}%"></i></div>
  </div>
  <section class="card">
    <p class="eyebrow">Pregunta ${pad(S.idx + 1)}</p>
    <h2 class="qtext">${esc(q.t)}</h2>
    ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
    <label class="sr" for="ans">Tu respuesta</label>
    <textarea id="ans" lang="es" class="${q.big ? "big" : ""}" placeholder="Escribe tu respuesta aquí">${esc(S.answers[qi] || "")}</textarea>
  </section>
  <div class="row nav">
    <button class="btn" data-act="prev"${S.idx === 0 ? " disabled" : ""}>Anterior</button>
    <button class="btn primary" data-act="${last ? "finish" : "next"}">${last ? "Terminar y calificar" : "Siguiente"}</button>
  </div>
  <nav class="chips" aria-label="Ir a una pregunta">${chips}</nav>
  ${S.confirm ? `<div class="confirm" role="alert"><p>Te ${missing === 1 ? "falta 1 pregunta" : "faltan " + missing + " preguntas"} sin responder. Las preguntas vacías cuentan como incorrectas.</p><div class="row"><button class="btn" data-act="cancel">Seguir respondiendo</button><button class="btn primary" data-act="grade">Calificar ahora</button></div></div>` : (last ? "" : `<div><button class="btn ghost" data-act="finish">Terminar y calificar</button></div>`)}`;
  if (focus) { const ta = document.getElementById("ans"); if (ta) ta.focus({ preventScroll: true }); }
}

const LABEL = { ok: "✓ Correcta", partial: "◐ Parcial", bad: "✕ Incorrecta" };
function renderResult() {
  const total = S.res.length;
  const credits = S.res.reduce((a, r) => a + r.credit, 0);
  const score = (credits / total) * 10;
  const nOk = S.res.filter(r => r.status === "ok").length, nP = S.res.filter(r => r.status === "partial").length, nB = total - nOk - nP;
  const verdict = score >= 9 ? "Dominas muy bien el tema." : score >= 7 ? "Vas bien. Repasa las preguntas que no salieron completas." : score >= 6 ? "Pasas por poco. Repasa las respuestas de abajo antes del examen." : "Necesitas repasar más. Empieza por las respuestas correctas de abajo.";
  const review = S.res.filter(r => r.status !== "ok");
  const list = (S.filter === "review" ? S.res.map((r, p) => ({ r, p })).filter(x => x.r.status !== "ok") : S.res.map((r, p) => ({ r, p })));
  const items = list.map(({ r, p }) => {
    const q = Q[r.i], a = (S.answers[r.i] || "").trim();
    const label = r.empty ? "✕ Sin responder" : LABEL[r.status];
    const note = q.note ? `<p class="note">${esc(q.note)}</p>` : "";
    const correct = r.status === "ok"
      ? `<details class="res-d"><summary>Ver la respuesta de la guía</summary><div class="blk correct"><p class="lbl">Respuesta de la guía</p>${ansLines(q)}${note}</div></details>`
      : `<div class="blk correct"><p class="lbl">Respuesta correcta</p>${ansLines(q)}${note}</div>`;
    return `<article class="res">
      <header><span class="eyebrow">Pregunta ${pad(p + 1)}</span><span class="pill ${r.status}">${label}</span></header>
      <h3>${esc(q.t)}</h3>
      <div class="blk"><p class="lbl">Tu respuesta</p><p class="user">${a ? esc(a) : "<em class=\"muted\">Sin respuesta</em>"}</p></div>
      ${correct}
    </article>`;
  }).join("");
  app.innerHTML = `
  <section class="card score">
    <p class="eyebrow">Tu calificación</p>
    <p class="big mono">${score.toFixed(1)}<small> / 10</small></p>
    <div class="tally"><span class="pill ok">${nOk} correctas</span><span class="pill partial">${nP} parciales</span><span class="pill bad">${nB} incorrectas</span></div>
    <p>${verdict}</p>
    <div class="row">
      ${review.length ? `<button class="btn primary" data-act="retry-missed">Repetir solo las ${review.length} que fallé</button>` : ""}
      <button class="btn${review.length ? "" : " primary"}" data-act="restart">Repetir examen completo</button>
    </div>
  </section>
  <div class="seg" role="group" aria-label="Filtrar preguntas">
    <button class="btn" data-act="filter" data-v="all" aria-pressed="${S.filter === "all"}">Todas (${total})</button>
    <button class="btn" data-act="filter" data-v="review" aria-pressed="${S.filter === "review"}">Para repasar (${review.length})</button>
  </div>
  ${items || `<section class="card"><p>No hay preguntas para repasar. Respondiste todo bien.</p></section>`}`;
}

function render(focus) {
  if (S.screen === "start") renderStart();
  else if (S.screen === "exam") renderExam(focus);
  else renderResult();
}
function begin(order) {
  S = { screen: "exam", order, idx: 0, answers: {}, res: null, confirm: false, filter: "all" };
  saveProgress(); render(true); window.scrollTo(0, 0);
}
function shuffled(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function goTo(p) { S.idx = Math.max(0, Math.min(S.order.length - 1, p)); S.confirm = false; saveProgress(); render(true); window.scrollTo(0, 0); }
function gradeAll() {
  S.res = S.order.map(i => ({ i, ...grade(Q[i], S.answers[i] || "") }));
  S.screen = "result"; S.filter = "all"; clearProgress(); render(); window.scrollTo(0, 0);
}

app.addEventListener("input", e => {
  if (e.target.id !== "ans") return;
  S.answers[S.order[S.idx]] = e.target.value;
  saveProgress();
  const done = answered();
  document.getElementById("cnt").textContent = done + " respondidas";
  document.getElementById("barfill").style.width = (done / S.order.length) * 100 + "%";
  const chip = app.querySelector(".chip.cur"); if (chip) chip.classList.toggle("done", false);
  const cur = app.querySelectorAll(".chip");
  cur.forEach((c, p) => { if (p !== S.idx) c.classList.toggle("done", !!(S.answers[S.order[p]] || "").trim()); });
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "start") { const sh = document.getElementById("shuffle"); begin(sh && sh.checked ? shuffled(Q.length) : Array.from({ length: Q.length }, (_, i) => i)); }
  else if (act === "resume") { const p = loadProgress(); if (p) { S = { screen: "exam", order: p.order, idx: p.idx, answers: p.answers, res: null, confirm: false, filter: "all" }; render(true); window.scrollTo(0, 0); } }
  else if (act === "next") goTo(S.idx + 1);
  else if (act === "prev") goTo(S.idx - 1);
  else if (act === "go") goTo(+b.dataset.p);
  else if (act === "finish") { if (answered() < S.order.length) { S.confirm = true; render(); const c = app.querySelector(".confirm"); if (c) c.scrollIntoView({ block: "center" }); } else gradeAll(); }
  else if (act === "cancel") { S.confirm = false; render(true); }
  else if (act === "grade") gradeAll();
  else if (act === "filter") { S.filter = b.dataset.v; renderResult(); }
  else if (act === "retry-missed") begin(S.res.filter(r => r.status !== "ok").map(r => r.i));
  else if (act === "restart") { S = { screen: "start", order: [], idx: 0, answers: {}, res: null, confirm: false, filter: "all" }; clearProgress(); render(); window.scrollTo(0, 0); }
});
render();
</script>
