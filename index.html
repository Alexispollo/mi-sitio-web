<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen Teoría del Estado</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: single centered exam sheet, sticky bar with form tabs and progress, one fieldset per question. */
:root {
  --bg: #eef0f4;
  --sheet: #ffffff;
  --fg: #1a2233;
  --muted: #5b6577;
  --line: #d5dae3;
  --accent: #2b45a1;
  --accent-soft: #e4e9fa;
  --accent-fg: #ffffff;
  --ok: #17703d;
  --ok-soft: #dff3e6;
  --bad: #a52a2a;
  --bad-soft: #f8e1e1;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121722;
    --sheet: #1a2131;
    --fg: #e6e9f0;
    --muted: #9aa3b5;
    --line: #2d3650;
    --accent: #8ea2f0;
    --accent-soft: #232d4d;
    --accent-fg: #101626;
    --ok: #62d08c;
    --ok-soft: #173525;
    --bad: #f08a8a;
    --bad-soft: #3b1e22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121722;
  --sheet: #1a2131;
  --fg: #e6e9f0;
  --muted: #9aa3b5;
  --line: #2d3650;
  --accent: #8ea2f0;
  --accent-soft: #232d4d;
  --accent-fg: #101626;
  --ok: #62d08c;
  --ok-soft: #173525;
  --bad: #f08a8a;
  --bad-soft: #3b1e22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--sheet);
  z-index: 10;
}
.wrap { max-width: 760px; margin: 0 auto; }

header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 9;
  background: var(--sheet);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
.tabs { display: flex; gap: 6px; }
.tab {
  font: inherit; font-size: 0.9rem; font-weight: 600;
  padding: 7px 14px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tab:focus-visible, .btn:focus-visible, .opt input:focus-visible + .opt-body { outline: 3px solid var(--accent); outline-offset: 2px; }
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
.count { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.intro { padding: 28px 0 8px; }
.intro .kicker { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
.intro h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.15; margin: 6px 0 8px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; }

.result {
  margin: 20px 0 4px; padding: 18px 20px;
  background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
}
.result[hidden] { display: none !important; }
.score { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--font-body); font-size: 0.9rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
.result-detail { color: var(--muted); font-size: 0.9rem; margin-top: 4px; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; }
.toolbar[hidden] { display: none !important; }
.toolbar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.order-label { font-size: 0.85rem; color: var(--muted); }
.btn.small { padding: 7px 14px; font-size: 0.85rem; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.q-list { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
fieldset.q {
  margin: 0; min-width: 0;
  background: var(--sheet); border: 1px solid var(--line); border-radius: 8px;
  padding: 18px 20px 14px;
}
fieldset.q legend {
  float: left; width: 100%; padding: 0; margin: 0 0 12px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.35;
  text-wrap: pretty;
}
fieldset.q legend + * { clear: both; }
.opts { display: flex; flex-direction: column; gap: 6px; clear: both; }
.opt { display: block; cursor: pointer; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt-body {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: transparent;
}
.opt:hover .opt-body { border-color: var(--accent); }
.opt input:checked + .opt-body { background: var(--accent-soft); border-color: var(--accent); }
.letter { font-weight: 700; color: var(--accent); flex: none; }
.otext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tag { flex: none; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.graded .opt { cursor: default; }
.graded .opt:hover .opt-body { border-color: var(--line); }
.graded .opt input:checked + .opt-body { border-color: var(--line); background: transparent; }
.graded .opt.is-correct .opt-body { background: var(--ok-soft); border-color: var(--ok); }
.graded .opt.is-correct .tag { color: var(--ok); }
.graded .opt.is-wrong .opt-body { background: var(--bad-soft); border-color: var(--bad); }
.graded .opt.is-wrong .tag { color: var(--bad); }
.note { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
.note.miss { color: var(--bad); font-weight: 600; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  font: inherit; font-weight: 600; font-size: 0.95rem;
  padding: 11px 22px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn[hidden] { display: none !important; }

@media (max-width: 480px) {
  fieldset.q { padding: 16px 14px 12px; }
  .opt-body { padding: 10px; }
}
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <span class="brand">Teoría del Estado</span>
      <div class="tabs" role="tablist" aria-label="Formularios">
        <button class="tab" role="tab" id="tab-1" data-form="1" aria-selected="true" type="button">Formulario 1</button>
        <button class="tab" role="tab" id="tab-2" data-form="2" aria-selected="false" type="button">Formulario 2</button>
      </div>
    </div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <div class="kicker" id="kicker"></div>
    <h1>Examen de Teoría del Estado</h1>
    <p>Elige una opción por pregunta. Al terminar, pulsa Calificar para ver tu resultado y las respuestas correctas.</p>
  </section>

  <div class="result" id="result" hidden role="status">
    <div>
      <div class="score" id="score"></div>
      <div class="result-detail" id="detail"></div>
    </div>
    <button class="btn ghost" id="retry-top" type="button">Reintentar</button>
  </div>

  <form id="exam" autocomplete="off">
    <div class="toolbar" id="toolbar">
      <span class="order-label" id="order-label"></span>
      <div class="toolbar-btns">
        <button class="btn small ghost" id="shuffle" type="button">Mezclar preguntas</button>
        <button class="btn small ghost" id="original" type="button">Orden original</button>
      </div>
    </div>
    <div class="q-list" id="qlist"></div>
    <div class="actions">
      <button class="btn" id="grade" type="submit">Calificar</button>
      <button class="btn ghost" id="reset" type="button">Borrar respuestas</button>
    </div>
  </form>
</main>

cial"}], "correct": "b"}, {"n": "16", "text": "¿Qué criterio permite analizar un sistema de partidos según la guía?", "options": [{"letter": "a", "text": "Polarización"}, {"letter": "b", "text": "Territorialidad"}, {"letter": "c", "text": "Religiosidad"}, {"letter": "d", "text": "Militarización"}], "correct": "a"}, {"n": "17", "text": "Una característica fundamental del Estado de Derecho liberal-burgués es contar con:", "options": [{"letter": "a", "text": "Constitución"}, {"letter": "b", "text": "Partido único"}, {"letter": "c", "text": "Monarquía"}, {"letter": "d", "text": "Ejército permanente"}], "correct": "a"}, {"n": "18", "text": "La Constitución mexicana de 1917 se caracteriza en la guía como:", "options": [{"letter": "a", "text": "Flexible y centralista"}, {"letter": "b", "text": "Rígida y federal"}, {"letter": "c", "text": "Monárquica y federal"}, {"letter": "d", "text": "Parlamentaria y unitaria"}], "correct": "b"}, {"n": "19", "text": "La parte dogmática de la Constitución mexicana se relaciona principalmente con:", "options": [{"letter": "a", "text": "Derechos y garantías"}, {"letter": "b", "text": "División territorial"}, {"letter": "c", "text": "Política exterior"}, {"letter": "d", "text": "Administración pública"}], "correct": "a"}, {"n": "20", "text": "Conforme al artículo 39 mencionado en la guía, la soberanía nacional reside en:", "options": [{"letter": "a", "text": "El Congreso"}, {"letter": "b", "text": "El Presidente"}, {"letter": "c", "text": "El pueblo"}, {"letter": "d", "text": "La Federación"}], "correct": "c"}, {"n": "21", "text": "¿Qué principio pretende evitar la concentración y el abuso del poder?", "options": [{"letter": "a", "text": "Separación de poderes"}, {"letter": "b", "text": "Centralización política"}, {"letter": "c", "text": "Soberanía absoluta"}, {"letter": "d", "text": "Gobierno unitario"}], "correct": "a"}, {"n": "22", "text": "¿Qué pensador es asociado directamente con la teoría clásica de separación de poderes?", "options": [{"letter": "a", "text": "Hauriou"}, {"letter": "b", "text": "Montesquieu"}, {"letter": "c", "text": "Jellinek"}, {"letter": "d", "text": "Santo Tomás"}], "correct": "b"}, {"n": "23", "text": "La función que determina la norma aplicable a casos particulares es la:", "options": [{"letter": "a", "text": "Legislativa"}, {"letter": "b", "text": "Jurisdiccional"}, {"letter": "c", "text": "Electoral"}, {"letter": "d", "text": "Diplomática"}], "correct": "b"}, {"n": "24", "text": "La función administrativa busca principalmente:", "options": [{"letter": "a", "text": "Crear constituciones"}, {"letter": "b", "text": "Satisfacer necesidades colectivas"}, {"letter": "c", "text": "Resolver litigios"}, {"letter": "d", "text": "Reformar leyes"}], "correct": "b"}, {"n": "25", "text": "Según la concepción moderna expuesta en la guía, la separación de poderes debe aplicarse:", "options": [{"letter": "a", "text": "De manera absolutamente rígida"}, {"letter": "b", "text": "Con cierta elasticidad"}, {"letter": "c", "text": "Sin controles recíprocos"}, {"letter": "d", "text": "Solo al Poder Legislativo"}], "correct": "b"}]};

const state = {
  current: "1",
  answers: { "1": {}, "2": {} },
  graded: { "1": false, "2": false },
  order: { "1": null, "2": null },
  shuffled: { "1": false, "2": false }
};

function identityOrder(f) {
  return DATA[f].map(function (_, i) { return i; });
}
state.order["1"] = identityOrder("1");
state.order["2"] = identityOrder("2");

function shuffleOrder(f) {
  const a = identityOrder(f);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  state.order[f] = a;
  state.shuffled[f] = true;
}

const qlist = document.getElementById("qlist");
const bar = document.getElementById("bar");
const count = document.getElementById("count");
const resultBox = document.getElementById("result");
const scoreEl = document.getElementById("score");
const detailEl = document.getElementById("detail");
const kicker = document.getElementById("kicker");
const gradeBtn = document.getElementById("grade");
const resetBtn = document.getElementById("reset");
const examForm = document.getElementById("exam");

function render() {
  const f = state.current;
  const qs = DATA[f];
  const graded = state.graded[f];
  const ans = state.answers[f];
  kicker.textContent = "Formulario " + f + " · " + qs.length + " preguntas";
  qlist.textContent = "";
  state.order[f].map(function (idx) { return qs[idx]; }).forEach(function (q, i) {
    const fs = document.createElement("fieldset");
    fs.className = "q" + (graded ? " graded" : "");
    const lg = document.createElement("legend");
    lg.textContent = (i + 1) + ". " + q.text;
    fs.appendChild(lg);
    const opts = document.createElement("div");
    opts.className = "opts";
    q.options.forEach(function (o) {
      const lab = document.createElement("label");
      lab.className = "opt";
      const inp = document.createElement("input");
      inp.type = "radio";
      inp.name = "f" + f + "-q" + q.n;
      inp.id = "f" + f + "-q" + q.n + "-" + o.letter;
      inp.value = o.letter;
      inp.checked = ans[q.n] === o.letter;
      inp.disabled = graded;
      const body = document.createElement("span");
      body.className = "opt-body";
      const l = document.createElement("span");
      l.className = "letter";
      l.textContent = o.letter + ")";
      const t = document.createElement("span");
      t.className = "otext";
      t.textContent = o.text;
      body.appendChild(l);
      body.appendChild(t);
      if (graded) {
        const isCorrect = o.letter === q.correct;
        const chosen = ans[q.n] === o.letter;
        if (isCorrect) {
          lab.classList.add("is-correct");
          const tg = document.createElement("span");
          tg.className = "tag";
          tg.textContent = chosen ? "Correcta · tu respuesta" : "Correcta";
          body.appendChild(tg);
        } else if (chosen) {
          lab.classList.add("is-wrong");
          const tg = document.createElement("span");
          tg.className = "tag";
          tg.textContent = "Tu respuesta";
          body.appendChild(tg);
        }
      }
      lab.appendChild(inp);
      lab.appendChild(body);
      opts.appendChild(lab);
    });
    fs.appendChild(opts);
    if (graded && !ans[q.n]) {
      const p = document.createElement("p");
      p.className = "note miss";
      p.textContent = "Sin responder.";
      fs.appendChild(p);
    }
    qlist.appendChild(fs);
  });
  updateProgress();
  updateResult();
  gradeBtn.hidden = graded;
  resetBtn.textContent = graded ? "Reintentar" : "Borrar respuestas";
  document.getElementById("toolbar").hidden = graded;
  document.getElementById("order-label").textContent = state.shuffled[f] ? "Orden: aleatorio" : "Orden: original";
  document.getElementById("original").disabled = !state.shuffled[f];
  document.getElementById("tab-1").setAttribute("aria-selected", String(f === "1"));
  document.getElementById("tab-2").setAttribute("aria-selected", String(f === "2"));
}

function updateProgress() {
  const f = state.current;
  const total = DATA[f].length;
  const done = Object.keys(state.answers[f]).length;
  bar.style.width = (done / total * 100) + "%";
  count.textContent = done + " / " + total + " respondidas";
}

function updateResult() {
  const f = state.current;
  if (!state.graded[f]) { resultBox.hidden = true; return; }
  const qs = DATA[f];
  let right = 0, blank = 0;
  qs.forEach(function (q) {
    const a = state.answers[f][q.n];
    if (!a) blank++;
    else if (a === q.correct) right++;
  });
  const wrong = qs.length - right - blank;
  const pct = Math.round(right / qs.length * 100);
  scoreEl.textContent = "";
  scoreEl.appendChild(document.createTextNode(right + " de " + qs.length));
  const sm = document.createElement("small");
  sm.textContent = pct + "%";
  scoreEl.appendChild(sm);
  detailEl.textContent = right + " correctas · " + wrong + " incorrectas · " + blank + " sin responder";
  resultBox.hidden = false;
}

function resetCurrent() {
  state.answers[state.current] = {};
  state.graded[state.current] = false;
  render();
  window.scrollTo(0, 0);
}

qlist.addEventListener("change", function (e) {
  const t = e.target;
  if (t && t.type === "radio" && !state.graded[state.current]) {
    const m = /-q(\d+)$/.exec(t.name);
    if (m) {
      state.answers[state.current][m[1]] = t.value;
      updateProgress();
    }
  }
});

examForm.addEventListener("submit", function (e) {
  e.preventDefault();
  state.graded[state.current] = true;
  render();
  window.scrollTo(0, 0);
});

document.getElementById("shuffle").addEventListener("click", function () {
  shuffleOrder(state.current);
  render();
  window.scrollTo(0, 0);
});
document.getElementById("original").addEventListener("click", function () {
  state.order[state.current] = identityOrder(state.current);
  state.shuffled[state.current] = false;
  render();
  window.scrollTo(0, 0);
});

resetBtn.addEventListener("click", resetCurrent);
document.getElementById("retry-top").addEventListener("click", resetCurrent);

document.querySelectorAll(".tab").forEach(function (b) {
  b.addEventListener("click", function () {
    const f = b.getAttribute("data-form");
    if (f === state.current) return;
    state.current = f;
    try { history.replaceState(null, "", "#formulario-" + f); } catch (err) { location.hash = "formulario-" + f; }
    render();
    window.scrollTo(0, 0);
  });
});

function fromHash() {
  const m = /^#formulario-([12])$/.exec(location.hash);
  const f = m ? m[1] : "1";
  if (f !== state.current) { state.current = f; render(); }
}
window.addEventListener("hashchange", fromHash);

(function init() {
  const m = /^#formulario-([12])$/.exec(location.hash);
  if (m) state.current = m[1];
  render();
})();
</script>

</body>
</html>
